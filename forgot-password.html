<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto83 | Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

/* Background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#2a2a2a 0%,transparent 35%),
    radial-gradient(circle at bottom right,#131313 0%,transparent 35%);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

/* Card */

.card{
    width:100%;
    max-width:480px;
    background:rgba(15,15,15,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    backdrop-filter:blur(18px);
    padding:45px 35px;
    box-shadow:0 25px 60px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:1.7rem;
    font-weight:700;
    margin-bottom:25px;
}

.logo span{
    color:#8d8d8d;
}

.icon{
    width:72px;
    height:72px;
    margin:0 auto 25px;
    border-radius:20px;
    background:#181818;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2rem;
    border:1px solid rgba(255,255,255,.05);
}

h1{
    text-align:center;
    font-size:2rem;
    margin-bottom:12px;
}

.subtitle{
    text-align:center;
    color:#a5a5a5;
    line-height:1.7;
    margin-bottom:35px;
    font-size:.95rem;
}

label{
    display:block;
    margin-bottom:8px;
    color:#d8d8d8;
    font-size:.9rem;
}

input{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:#161616;
    color:white;
    outline:none;
    transition:.3s;
    font-size:.95rem;
}

input:focus{
    border-color:#666;
    box-shadow:0 0 0 4px rgba(255,255,255,.05);
}

button{
    width:100%;
    margin-top:28px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:white;
    color:black;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(255,255,255,.15);
}

.back{
    margin-top:25px;
    text-align:center;
}

.back a{
    color:#bdbdbd;
    text-decoration:none;
    transition:.3s;
}

.back a:hover{
    color:white;
}

.note{
    margin-top:25px;
    padding:15px;
    border-radius:14px;
    background:#121212;
    border:1px solid rgba(255,255,255,.05);
    color:#9d9d9d;
    font-size:.85rem;
    line-height:1.6;
}

@media(max-width:480px){

    .card{
        padding:35px 22px;
    }

    h1{
        font-size:1.7rem;
    }

}
</style>
</head>
<body>

<div class="grid"></div>

<div class="card">

    <div class="logo">Auto<span>83</span></div>

    <div class="icon">🔒</div>

    <h1>Forgot Password</h1>

    <p class="subtitle">
        Enter the email address associated with your Auto83 account and we'll send you a password reset link.
    </p>

    <form>

        <label>Email Address</label>

        <input
            type="email"
            placeholder="example@email.com"
            required
        >

        <button type="submit">Send Reset Link</button>

    </form>

    <div class="note">
        If an account exists with this email address, you'll receive instructions to reset your password. Please check your inbox and spam folder.
    </div>

    <div class="back">
        <a href="login.html">← Back to Sign In</a>
    </div>

</div>

</body>
</html>
